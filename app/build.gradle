
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruvi.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ruvi.pro'
        minSdk 24
        targetSdk 35
        versionCode 52
        versionName '5.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
