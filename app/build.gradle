plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ruvi.privateapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ruvi.pro'
        minSdk 24
        targetSdk 35
        versionCode 54
        versionName '5.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
