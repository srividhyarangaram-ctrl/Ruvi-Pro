
name: Ruvi 5.2 Android APK

on:
  push:
    branches:
      - main
      - Main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android SDK 35
      shell: bash
      run: |
    set -e
    SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager -print -quit)"
    if [ -z "$SDKMANAGER" ]; then
      echo "Android SDK manager not found"
      exit 1
    fi
    "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
     
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Ruvi Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Ruvi APK
        uses: actions/upload-artifact@v4
        with:
      - name: Ruvi-5.2-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
